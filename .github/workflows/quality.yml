name: API quality gate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  http-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check code
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run HTTP regression
        run: python -m pytest --junitxml=artifacts/junit.xml --alluredir=artifacts/allure-results --clean-alluredir
      - name: Render the Allure report
        if: ${{ !cancelled() && hashFiles('artifacts/allure-results/*-result.json') != '' }}
        run: npx --yes allure-commandline@2.34.1 generate --clean artifacts/allure-results -o artifacts/allure-report
      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-quality-evidence
          path: artifacts/
          if-no-files-found: warn
